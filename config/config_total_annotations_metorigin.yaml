# MAPS Total-List-Of-Annotations.csv -> MetOriginDB matching configuration

maps_annotation_file: data/maps/Total-List-Of-Annotations.csv
metorigin_file: data/metorigin/MetOriginDB.csv
metorigin_index: data/metorigin/indexed-20261016/metorigin.sqlite
input_pubchem_namespace: cid
allow_sid_fallback: false

output_file: runs/total-annotations/outputs/metorigin_matches/MAPS_with_MetOriginDB_origin.csv

matching_priority:
  - cid
  - smiles
  - inchikey
  - hmdb
  - kegg
  - compound_name

deduplicate_metorigin_by_key: false
case_insensitive_name_match: true
exact_smiles_only: true
